<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bracketGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d0d7de"/>
    </linearGradient>
    <linearGradient id="bracketGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <pattern id="gridDark" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161b22" stroke-width="1" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="gridLight" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e5e7eb" stroke-width="1" stroke-opacity="0.8"/>
    </pattern>
  </defs>

  <style>
    .bg { fill: #09090b; }
    .border-stroke { stroke: #27272a; }
    .grid-pat { fill: url(#gridDark); }
    .bracket-fill { fill: url(#bracketGradDark); }
    .wordmark { fill: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 500; }
    .tagline { fill: #a1a1aa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 400; }
    .accent-pill { fill: #18181b; stroke: #27272a; }
    .pill-text { fill: #a1a1aa; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #fafafa; }
      .border-stroke { stroke: #e4e4e7; }
      .grid-pat { fill: url(#gridLight); }
      .bracket-fill { fill: url(#bracketGradLight); }
      .wordmark { fill: #09090b; }
      .tagline { fill: #71717a; }
      .accent-pill { fill: #f4f4f5; stroke: #e4e4e7; }
      .pill-text { fill: #71717a; }
    }
  </style>

  <!-- Background Card -->
  <rect class="bg border-stroke" x="2" y="2" width="896" height="256" rx="16" stroke-width="1.5"/>
  <rect class="grid-pat" x="2" y="2" width="896" height="256" rx="16"/>

  <!-- Centered Stokes Bracket Logo (Scaled & Positioned) -->
  <g transform="translate(450, 82) scale(0.12) translate(-512, -512)">
    <path class="bracket-fill" d="M92 108H307V216H200V806H307V914H92V108ZM930 108H715V216H822V806H715V914H930V108Z"/>
  </g>

  <!-- Stokes Brand Wordmark -->
  <text class="wordmark" x="450" y="172" text-anchor="middle" font-size="38" letter-spacing="-0.03em">stokes</text>

  <!-- Tagline -->
  <text class="tagline" x="450" y="202" text-anchor="middle" font-size="13.5" letter-spacing="0.08em" text-transform="lowercase">cross-boundary systems invariant verification engine</text>

  <!-- Pill Chips -->
  <g transform="translate(450, 226)">
    <!-- SQL -->
    <rect class="accent-pill" x="-185" y="-12" width="55" height="22" rx="11" stroke-width="1"/>
    <text class="pill-text" x="-157.5" y="3" text-anchor="middle" font-size="10.5">SQL</text>

    <!-- PROTO -->
    <rect class="accent-pill" x="-122" y="-12" width="70" height="22" rx="11" stroke-width="1"/>
    <text class="pill-text" x="-87" y="3" text-anchor="middle" font-size="10.5">PROTO</text>

    <!-- PYTHON -->
    <rect class="accent-pill" x="-44" y="-12" width="80" height="22" rx="11" stroke-width="1"/>
    <text class="pill-text" x="-4" y="3" text-anchor="middle" font-size="10.5">PYTHON</text>

    <!-- RUST -->
    <rect class="accent-pill" x="44" y="-12" width="65" height="22" rx="11" stroke-width="1"/>
    <text class="pill-text" x="76.5" y="3" text-anchor="middle" font-size="10.5">RUST</text>

    <!-- MCP -->
    <rect class="accent-pill" x="117" y="-12" width="60" height="22" rx="11" stroke-width="1"/>
    <text class="pill-text" x="147" y="3" text-anchor="middle" font-size="10.5">MCP</text>
  </g>
</svg>
