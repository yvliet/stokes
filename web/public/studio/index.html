<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/studio/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="96x96" href="/studio/brand/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="/studio/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/studio/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#242424" />
    <title>Stokes Studio | Storage Pipeline Canvas</title>
    <style>
      :root {
        --skel-bg: #1e1e1e;
        --skel-panel: #252526;
        --skel-border: rgba(255, 255, 255, 0.08);
        --skel-subtle: rgba(255, 255, 255, 0.05);
        --skel-highlight: rgba(255, 255, 255, 0.09);
        --skel-dot: rgba(255, 255, 255, 0.12);
        --skel-canvas-bg: #181818;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --skel-bg: #f9fafb;
          --skel-panel: #ffffff;
          --skel-border: rgba(0, 0, 0, 0.08);
          --skel-subtle: rgba(0, 0, 0, 0.04);
          --skel-highlight: rgba(0, 0, 0, 0.08);
          --skel-dot: rgba(0, 0, 0, 0.15);
          --skel-canvas-bg: #f3f4f6;
        }
      }
      html[data-theme='dark'] {
        --skel-bg: #1e1e1e;
        --skel-panel: #252526;
        --skel-border: rgba(255, 255, 255, 0.08);
        --skel-subtle: rgba(255, 255, 255, 0.05);
        --skel-highlight: rgba(255, 255, 255, 0.09);
        --skel-dot: rgba(255, 255, 255, 0.12);
        --skel-canvas-bg: #181818;
      }
      html[data-theme='light'] {
        --skel-bg: #f9fafb;
        --skel-panel: #ffffff;
        --skel-border: rgba(0, 0, 0, 0.08);
        --skel-subtle: rgba(0, 0, 0, 0.04);
        --skel-highlight: rgba(0, 0, 0, 0.08);
        --skel-dot: rgba(0, 0, 0, 0.15);
        --skel-canvas-bg: #f3f4f6;
      }
      body { margin: 0; background: var(--skel-bg); }
      #boot-skeleton {
        position: fixed;
        inset: 0;
        display: flex;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        background: var(--skel-bg);
        user-select: none;
      }
      @keyframes skel-shimmer {
        0% { opacity: 0.5; }
        50% { opacity: 0.9; }
        100% { opacity: 0.5; }
      }
      .skel-elem {
        background: var(--skel-highlight);
        border-radius: 4px;
        animation: skel-shimmer 2s ease-in-out infinite;
      }
      /* Left Dock Rail */
      .skel-rail {
        width: 44px;
        background: var(--skel-panel);
        border-right: 1px solid var(--skel-border);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        box-sizing: border-box;
      }
      .skel-rail-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }
      .skel-rail-icon {
        width: 28px;
        height: 28px;
        border-radius: 6px;
      }
      /* Left Sidebar */
      .skel-sidebar-l {
        width: 230px;
        background: var(--skel-panel);
        border-right: 1px solid var(--skel-border);
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
      }
      .skel-header-tabs {
        height: 40px;
        border-bottom: 1px solid var(--skel-border);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
      }
      .skel-tab-pill {
        height: 18px;
        border-radius: 4px;
      }
      .skel-tree-list {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .skel-tree-row {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 22px;
      }
      .skel-tree-icon {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        flex-shrink: 0;
      }
      .skel-tree-text {
        height: 12px;
        border-radius: 3px;
      }
      /* Center Canvas */
      .skel-canvas {
        flex: 1;
        position: relative;
        background-color: var(--skel-canvas-bg);
        background-image: radial-gradient(var(--skel-dot) 1px, transparent 1px);
        background-size: 20px 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .skel-canvas-card {
        width: 380px;
        height: 240px;
        background: var(--skel-panel);
        border: 1px solid var(--skel-border);
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        box-sizing: border-box;
      }
      .skel-toolbar {
        position: absolute;
        bottom: 24px;
        height: 42px;
        background: var(--skel-panel);
        border: 1px solid var(--skel-border);
        border-radius: 10px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        display: flex;
        align-items: center;
        padding: 0 10px;
        gap: 8px;
      }
      .skel-tool-item {
        width: 26px;
        height: 26px;
        border-radius: 5px;
      }
      /* Right Sidebar */
      .skel-sidebar-r {
        width: 250px;
        background: var(--skel-panel);
        border-left: 1px solid var(--skel-border);
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
      }
      .skel-section {
        padding: 14px 12px;
        border-bottom: 1px solid var(--skel-border);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .skel-grid-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .skel-input-box {
        height: 26px;
        border-radius: 4px;
      }
      /* Pre-boot support notice */
      #boot-notice {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 48px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        max-width: 560px;
        margin: 0 auto;
        text-align: center;
        color: var(--skel-highlight);
        background: var(--skel-bg);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #boot-notice img { width: 40px; height: 40px; margin-bottom: 8px; }
      #boot-notice h1 { margin: 0; font-size: 18px; font-weight: 600; }
      #boot-notice p { margin: 0; }
      #boot-notice nav { margin-top: 8px; }
      #boot-notice a { color: inherit; text-underline-offset: 3px; }
      #boot-notice details { margin-top: 16px; max-width: 100%; }
      #boot-notice summary { cursor: pointer; }
      #boot-notice pre {
        margin: 8px 0 0;
        padding: 12px;
        max-height: 40vh;
        overflow: auto;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
        border-radius: 6px;
        background: var(--skel-subtle);
        user-select: text;
        -webkit-user-select: text;
      }
    </style>
    <link rel="preload" href="/studio/canvaskit.wasm" as="fetch" type="application/wasm" crossorigin />
    <script type="module" crossorigin src="/studio/assets/index-CgoxZViZ.js"></script>

  </head>

  <body>
    <div id="app">
      <div id="boot-skeleton">
        <!-- Left Dock Rail -->
        <div class="skel-rail">
          <div class="skel-rail-group">
            <img src="/studio/brand/app-icon.svg" width="24" height="24" alt="Stokes" style="opacity: 0.8; margin-bottom: 4px;" />
            <div class="skel-elem skel-rail-icon"></div>
            <div class="skel-elem skel-rail-icon"></div>
            <div class="skel-elem skel-rail-icon"></div>
            <div class="skel-elem skel-rail-icon"></div>
          </div>
          <div class="skel-rail-group">
            <div class="skel-elem skel-rail-icon"></div>
            <div class="skel-elem skel-rail-icon" style="border-radius: 50%;"></div>
          </div>
        </div>

        <!-- Left Layers Sidebar -->
        <div class="skel-sidebar-l">
          <div class="skel-header-tabs">
            <div class="skel-elem skel-tab-pill" style="width: 52px;"></div>
            <div class="skel-elem skel-tab-pill" style="width: 48px; opacity: 0.4;"></div>
            <div class="skel-elem skel-tab-pill" style="width: 44px; opacity: 0.4;"></div>
          </div>
          <div class="skel-tree-list">
            <div class="skel-tree-row">
              <div class="skel-elem skel-tree-icon"></div>
              <div class="skel-elem skel-tree-text" style="width: 100px;"></div>
            </div>
            <div class="skel-tree-row" style="padding-left: 12px;">
              <div class="skel-elem skel-tree-icon"></div>
              <div class="skel-elem skel-tree-text" style="width: 80px;"></div>
            </div>
            <div class="skel-tree-row" style="padding-left: 24px;">
              <div class="skel-elem skel-tree-icon"></div>
              <div class="skel-elem skel-tree-text" style="width: 95px;"></div>
            </div>
            <div class="skel-tree-row" style="padding-left: 24px;">
              <div class="skel-elem skel-tree-icon"></div>
              <div class="skel-elem skel-tree-text" style="width: 70px;"></div>
            </div>
            <div class="skel-tree-row" style="padding-left: 12px;">
              <div class="skel-elem skel-tree-icon"></div>
              <div class="skel-elem skel-tree-text" style="width: 90px;"></div>
            </div>
            <div class="skel-tree-row">
              <div class="skel-elem skel-tree-icon"></div>
              <div class="skel-elem skel-tree-text" style="width: 85px;"></div>
            </div>
          </div>
        </div>

        <!-- Center Canvas -->
        <div class="skel-canvas">
          <div class="skel-canvas-card">
            <div class="skel-elem" style="width: 40%; height: 18px;"></div>
            <div class="skel-elem" style="width: 85%; height: 12px; opacity: 0.5;"></div>
            <div class="skel-elem" style="width: 70%; height: 12px; opacity: 0.5;"></div>
            <div class="skel-elem" style="width: 30%; height: 28px; border-radius: 6px; margin-top: auto;"></div>
          </div>

          <!-- Bottom Floating Toolbar -->
          <div class="skel-toolbar">
            <div class="skel-elem skel-tool-item"></div>
            <div class="skel-elem skel-tool-item"></div>
            <div class="skel-elem skel-tool-item"></div>
            <div class="skel-elem skel-tool-item"></div>
            <div style="width: 1px; height: 18px; background: var(--skel-border);"></div>
            <div class="skel-elem skel-tool-item"></div>
            <div class="skel-elem skel-tool-item"></div>
            <div class="skel-elem skel-tool-item"></div>
          </div>
        </div>

        <!-- Right Properties Sidebar -->
        <div class="skel-sidebar-r">
          <div class="skel-header-tabs">
            <div class="skel-elem skel-tab-pill" style="width: 55px;"></div>
            <div class="skel-elem skel-tab-pill" style="width: 55px; opacity: 0.4;"></div>
          </div>
          <div class="skel-section">
            <div class="skel-grid-row">
              <div class="skel-elem skel-input-box"></div>
              <div class="skel-elem skel-input-box"></div>
              <div class="skel-elem skel-input-box"></div>
              <div class="skel-elem skel-input-box"></div>
            </div>
          </div>
          <div class="skel-section">
            <div class="skel-elem" style="width: 40px; height: 12px;"></div>
            <div style="display: flex; gap: 8px; align-items: center;">
              <div class="skel-elem" style="width: 22px; height: 22px; border-radius: 4px;"></div>
              <div class="skel-elem skel-input-box" style="flex: 1;"></div>
            </div>
          </div>
          <div class="skel-section">
            <div class="skel-elem" style="width: 45px; height: 12px;"></div>
            <div style="display: flex; gap: 8px; align-items: center;">
              <div class="skel-elem" style="width: 22px; height: 22px; border-radius: 4px;"></div>
              <div class="skel-elem skel-input-box" style="flex: 1;"></div>
            </div>
          </div>
          <div class="skel-section" style="border-bottom: none;">
            <div class="skel-elem" style="width: 50px; height: 12px;"></div>
            <div class="skel-elem skel-input-box" style="width: 100%;"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
